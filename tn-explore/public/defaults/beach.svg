<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="grad_beach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <radialGradient id="glow_beach" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grad_beach)" />
  <rect width="800" height="500" fill="url(#glow_beach)" />
  <circle cx="400" cy="200" r="140" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="400" cy="200" r="90" fill="#ffffff" fill-opacity="0.12" />
  <text x="400" y="215" font-size="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">🌊</text>
  <text x="400" y="320" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Georgia, serif">Coastal Sands & Ocean View</text>
  <text x="400" y="360" font-size="16" fill="#FAF3E0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="1">Coromandel & Indian Ocean Coastline</text>
  <text x="400" y="440" font-size="14" fill="#D4A574" text-anchor="middle" font-weight="600" font-family="system-ui, sans-serif" letter-spacing="3">TN EXPLORE • TAMIL NADU TOURISM</text>
</svg>