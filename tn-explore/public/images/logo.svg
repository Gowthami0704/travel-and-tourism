<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#141E33" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle with Border -->
  <rect width="96" height="96" x="2" y="2" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Adventure Sun / Compass Star -->
  <circle cx="50" cy="34" r="13" fill="url(#sunGrad)" opacity="0.95" filter="url(#glow)" />
  <path d="M50 16 L53 31 L68 34 L53 37 L50 52 L47 37 L32 34 L47 31 Z" fill="#FFFBEB" opacity="0.9" />

  <!-- Back Mountain Peak -->
  <polygon points="20,78 45,42 70,78" fill="#1E293B" opacity="0.9" />
  <polygon points="45,42 54,55 45,58 36,55" fill="#E2E8F0" opacity="0.85" />

  <!-- Front Adventure Mountain Peaks -->
  <polygon points="32,80 62,36 92,80" fill="url(#emeraldGrad)" />
  <polygon points="62,36 72,50 62,54 52,50" fill="#FFFFFF" opacity="0.9" />
  <polygon points="8,80 34,44 60,80" fill="url(#goldGrad)" opacity="0.95" />
  <polygon points="34,44 42,56 34,60 26,56" fill="#FFFBEB" />

  <!-- Compass Needle Ring Base -->
  <path d="M18 84 Q50 90 82 84" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
